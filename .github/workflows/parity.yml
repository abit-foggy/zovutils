name: GNU Coreutils parity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            arch: x86_64
            runner: ubuntu-24.04
          - platform: Linux
            arch: aarch64
            runner: ubuntu-24.04-arm
          - platform: macOS
            arch: x86_64
            runner: macos-15-intel
          - platform: macOS
            arch: aarch64
            runner: macos-15

    steps:
      - name: Check out Zovutils
        uses: actions/checkout@v7.0.1

      - name: Check out Zov compiler
        uses: actions/checkout@v7.0.1
        with:
          repository: abit-foggy/zov
          ref: cdf451a3065311f78f21463df2f9638c8b9b4db8
          path: zov
          submodules: recursive

      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual="$(uname -m)"
          case "$EXPECTED_ARCH:$actual" in
            x86_64:x86_64|x86_64:amd64|aarch64:aarch64|aarch64:arm64) ;;
            *) echo "Expected $EXPECTED_ARCH runner, got $actual" >&2; exit 1 ;;
          esac

      - name: Build Zov compiler
        run: make -C zov zovc

      - name: Build GNU Coreutils 9.11 oracle
        env:
          PREFIX: ${{ runner.temp }}/gnu-coreutils
        run: |
          curl --fail --location --silent --show-error \
            https://ftp.gnu.org/gnu/coreutils/coreutils-9.11.tar.xz \
            --output "$RUNNER_TEMP/coreutils-9.11.tar.xz"
          python3 - "$RUNNER_TEMP/coreutils-9.11.tar.xz" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          expected = "394024eda0a5955217ceda9cd1201e65dc8fa3aa29c2951135a49521d57c3cc3"
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"GNU Coreutils archive checksum mismatch: {actual}")
          PY
          tar -xJf "$RUNNER_TEMP/coreutils-9.11.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/coreutils-9.11"
          ./configure --disable-nls --prefix="$PREFIX"
          make -j2
          make install

      - name: Run unit and parity suites
        env:
          GNU_COREUTILS_DIR: ${{ runner.temp }}/gnu-coreutils/bin
          ZOVC: ${{ github.workspace }}/zov/zovc
          ZOVUTILS_DEBUG_DIRECT_IO: ${{ matrix.platform == 'Linux' && matrix.arch == 'aarch64' && '1' || '' }}
        run: make test

      - name: Run ASan and UBSan parity
        if: matrix.platform == 'Linux' && matrix.arch == 'x86_64'
        env:
          GNU_COREUTILS_DIR: ${{ runner.temp }}/gnu-coreutils/bin
          ZOVC: ${{ github.workspace }}/zov/zovc
          CC: clang
        run: make asan-parity
